<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatsong DM</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f0f2f5; height:100vh; display:flex; flex-direction:column; }
.dm-header { background:linear-gradient(135deg,#1DB954,#15803d); color:white; padding:12px 16px; display:flex; align-items:center; gap:10px; }
.dm-header img { width:36px; height:36px; border-radius:50%; border:2px solid white; }
.dm-header h3 { font-size:16px; }
.dm-messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
.dm-msg { max-width:80%; padding:10px 14px; border-radius:18px; font-size:14px; line-height:1.4; word-break:break-word; }
.dm-msg.me { align-self:flex-end; background:#1DB954; color:white; border-bottom-right-radius:4px; }
.dm-msg.them { align-self:flex-start; background:white; color:#333; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,0.1); }
.dm-time { font-size:10px; opacity:0.7; margin-top:4px; }
.dm-input { display:flex; gap:8px; padding:12px; background:white; border-top:1px solid #e2e8f0; }
.dm-input input { flex:1; padding:10px 14px; border:1px solid #e2e8f0; border-radius:20px; font-size:14px; outline:none; }
.dm-input input:focus { border-color:#1DB954; }
.dm-input button { padding:10px 18px; background:#1DB954; color:white; border:none; border-radius:20px; font-weight:700; cursor:pointer; }
.dm-empty { text-align:center; color:#888; padding:40px; font-size:14px; }
</style>
</head>
<body>

<div class="dm-header">
  <span style="font-size:24px;">💬</span>
  <div>
    <h3 id="dm-recipient">Loading...</h3>
    <small style="opacity:0.8;">Chatsong Direct Message</small>
  </div>
</div>

<div class="dm-messages" id="dm-messages">
  <div class="dm-empty">Start the conversation! 🎵</div>
</div>

<div class="dm-input">
  <input type="text" id="dm-text" placeholder="Type a message..." maxlength="500">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CHATSONG DM FRONTEND
// ═══════════════════════════════════════════════════════════

const API_URL = 'https://script.google.com/macros/s/AKfycbxdPjrXrTPb-GnfMuHX2ZmhYVGZRUGRELCxQp6u6_zHApNhpm9EweNiAEykSOmRpLV_/exec';
const params = new URLSearchParams(window.location.search);

const CURRENT_USER = params.get('me') || 'Guest';
const RECIPIENT = params.get('to') || 'Unknown';

document.getElementById('dm-recipient').textContent = RECIPIENT;

// Enter = send
document.getElementById('dm-text').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendMessage();
});

async function loadMessages() {
  try {
    const res = await fetch(`${API_URL}?action=get&from=${encodeURIComponent(CURRENT_USER)}&to=${encodeURIComponent(RECIPIENT)}`);
    const messages = await res.json();
    
    const container = document.getElementById('dm-messages');
    
    if (messages.length === 0) {
      container.innerHTML = '<div class="dm-empty">Start the conversation! 🎵</div>';
      return;
    }
    
    container.innerHTML = messages.map(m => `
      <div class="dm-msg ${m.from === CURRENT_USER ? 'me' : 'them'}">
        ${escapeHtml(m.text)}
        <div class="dm-time">${formatTime(m.time)}</div>
      </div>
    `).join('');
    
    container.scrollTop = container.scrollHeight;
  } catch(e) {
    console.error('Load error:', e);
  }
}

async function sendMessage() {
  const input = document.getElementById('dm-text');
  const text = input.value.trim();
  if (!text) return;
  
  input.value = '';
  
  try {
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'send',
        from: CURRENT_USER,
        to: RECIPIENT,
        text: text
      })
    });
    
    loadMessages();
  } catch(e) {
    console.error('Send error:', e);
    alert('Could not send message');
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

// Poll elke 5 sec
loadMessages();
setInterval(loadMessages, 5000);
</script>

</body>
</html>
